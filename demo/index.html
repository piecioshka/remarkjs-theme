# remarkjs-theme

Press **d** to switch between light and dark

---

## How it works

- the deck starts with the theme of your system
- **d** toggles light and dark
- the choice is saved in `localStorage`, so it survives a reload
- `remarkTheme().reset()` follows the system again

---

## Styling

The plugin only sets `data-theme="light"` or `data-theme="dark"` on `<html>`.

```css
:root[data-theme="dark"] {
  --bg: #111827;
  --fg: #f9fafb;
}
```

---

## Help screen

The shortcut shows up on remark's help screen (**?** or **h**).
